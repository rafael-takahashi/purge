<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Remover</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      width: 260px;
      color: #1a202c;
    }

    .info {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      background: #f7fafc;
    }

    .info p {
      line-height: 1.6;
    }

    .info .label {
      color: #718096;
      font-size: 12px;
    }

    .info .value {
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      background: #fff;
      color: #2d3748;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover:not(:disabled) {
      background: #edf2f7;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btn-reset {
      color: #c53030;
      border-color: #feb2b2;
    }

    #btn-reset:hover:not(:disabled) {
      background: #fff5f5;
    }

    .confirm-zone {
      display: none;
      padding: 10px 16px;
      border-top: 1px solid #fed7d7;
      background: #fff5f5;
    }

    .confirm-zone.visible {
      display: block;
    }

    .confirm-zone p {
      font-size: 12px;
      color: #c53030;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .confirm-zone .confirm-buttons {
      display: flex;
      gap: 8px;
    }

    #btn-confirm-reset {
      background: #c53030;
      color: #fff;
      border-color: #c53030;
    }

    #btn-confirm-reset:hover:not(:disabled) {
      background: #9b2c2c;
    }

    #btn-cancel-reset {
      flex: 1;
    }

    .toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .toggle-label {
      font-size: 13px;
      color: #4a5568;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #cbd5e0;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-track::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: #48bb78;
    }

    .toggle input:checked + .toggle-track::after {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <div class="toggle-bar">
    <span class="toggle-label">Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-enabled" checked>
      <span class="toggle-track"></span>
    </label>
  </div>
  <div class="info">
    <p><span class="label">Site: </span><span class="value" id="site-name">—</span></p>
    <p><span class="label">Deletions: </span><span class="value" id="deletion-count">—</span></p>
  </div>
  <div class="actions">
    <button id="btn-undo" disabled>Undo Last</button>
    <button id="btn-reset" disabled>Reset Site</button>
  </div>
  <div class="confirm-zone" id="confirm-zone">
    <p>Remove all deletion rules for this site and reload?</p>
    <div class="confirm-buttons">
      <button id="btn-cancel-reset">Cancel</button>
      <button id="btn-confirm-reset">Reset</button>
    </div>
  </div>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
